name: Tests

on:
  push:
  pull_request:
  release:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-guardrails:
    name: CI guardrails
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: Run CI contract unit tests
        run: python3 -m unittest -v ci.tests.test_check_ci_contracts
      - name: Run CI guardrails
        run: bash ci/run_local_ci_parity.sh --guardrails-only
  full-build-test:
    name: Full Linux build and test parity
    needs: ci-guardrails
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore and save Nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      - name: Restore pinned CUDA 11.8 closure from tbc-tools-ci-cache
        # Insulate CUDA 11.8 fetches from cache.nixos.org GC / the Nixpkgs
        # 25.05 removal of cudaPackages_11_8: pull + restore the pinned
        # closure from the dedicated tbc-tools-ci-cache repo into the local
        # Nix store so `nix develop` finds the CUDA paths locally. Best
        # effort: if the cache repo is unreachable, fall back to cache.nixos.org.
        shell: bash
        continue-on-error: true
        run: |
          set +e
          bash scripts/cuda-closure-cache.sh pull --out ./cuda-cache
          pull_rc=$?
          if [ "$pull_rc" -ne 0 ]; then
            echo "::warning::CUDA closure pull from tbc-tools-ci-cache failed (rc=$pull_rc); falling back to cache.nixos.org for CUDA 11.8 paths."
            exit 0
          fi
          bash scripts/cuda-closure-cache.sh restore --out ./cuda-cache
          restore_rc=$?
          if [ "$restore_rc" -ne 0 ]; then
            echo "::warning::CUDA closure restore failed (rc=$restore_rc); falling back to cache.nixos.org for CUDA 11.8 paths."
            exit 0
          fi
          echo "CUDA 11.8 closure restored from tbc-tools-ci-cache; nix develop will use local store paths."
      - name: Build and test full parity flow
        run: bash ci/run_local_ci_parity.sh --build-test-only
  build-linux-release-style:
    name: Release-style Linux packaging build
    needs: ci-guardrails
    uses: ./.github/workflows/build_linux_tools.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit
  build-windows-release-style:
    name: Release-style Windows packaging build
    needs: ci-guardrails
    uses: ./.github/workflows/build_windows_tools.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit
  build-macos-release-style:
    name: Release-style macOS packaging build
    needs: ci-guardrails
    uses: ./.github/workflows/build_macos_tools.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit
