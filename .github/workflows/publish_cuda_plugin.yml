name: "Publish CUDA plugin"

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: "Plugin version (e.g. 1.0.0); the release tag will be cuda-plugin-v{version} (or cuda-lite-plugin-v{version} when dispatched from the lite job)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "cuda-plugin-v*"
      - "cuda-lite-plugin-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CACHE_REPOSITORY: "harrypm/tbc-tools-ci-cache"
  ORT_VERSION: "1.18.1"

jobs:
  build-and-publish:
    name: Build + publish CUDA plugin packages
    # Only run for workflow_dispatch or cuda-plugin-v* tags (not for the
    # cuda-lite-plugin-v* tags, which belong to the lite job below).
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748); ubuntu-24.04 keeps today's behaviour.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/cuda-plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Resolve plugin version + tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.plugin_version }}"
          else
            # Tag push: cuda-plugin-v1.0.0 -> version 1.0.0
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#cuda-plugin-v}"
          fi
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_TAG=cuda-plugin-v$VERSION" >> "$GITHUB_ENV"
          echo "Resolved plugin version: $VERSION (tag: cuda-plugin-v$VERSION)"

      - name: Install Nix
        shell: bash
        run: |
          curl -L https://nixos.org/nix/install | sh -s -- --no-daemon --yes
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "/root/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          {
            echo "NIX_CONFIG<<EOF"
            echo "experimental-features = nix-command flakes"
            echo "access-tokens = github.com=${{ github.token }}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "NIX_PATH=nixpkgs=channel:nixos-unstable" >> "$GITHUB_ENV"
          # ubuntu-latest ships the CA bundle at /etc/ssl/certs/ca-certificates.crt
          # (not /etc/pki/tls/certs/ca-bundle.crt, which is the Oracle Linux path
          # used by build_linux_tools.yml's containerized job). Setting the wrong
          # path makes Nix fail to fetch flake inputs over HTTPS.
          echo "NIX_SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Restore pinned CUDA 11.8 closure from tbc-tools-ci-cache
        # The cuda-plugin-linux-deps attr needs the CUDA 11.8 closure in the
        # local Nix store (cuDNN 8.9 .so files come from there). Best-effort
        # with cache.nixos.org fallback.
        shell: bash
        continue-on-error: true
        run: |
          set +e
          bash scripts/cuda-closure-cache.sh pull --out ./cuda-cache
          pull_rc=$?
          if [ "$pull_rc" -ne 0 ]; then
            echo "::warning::CUDA closure pull failed (rc=$pull_rc); falling back to cache.nixos.org."
            exit 0
          fi
          bash scripts/cuda-closure-cache.sh restore --out ./cuda-cache
          restore_rc=$?
          if [ "$restore_rc" -ne 0 ]; then
            echo "::warning::CUDA closure restore failed (rc=$restore_rc); falling back to cache.nixos.org."
            exit 0
          fi
          echo "CUDA 11.8 closure restored."

      - name: Build Linux plugin deps (Nix store .so staging)
        shell: bash
        run: |
          nix build .#cuda-plugin-linux-deps --out-link cuda-deps
          echo "Staged .so files:"
          ls -la cuda-deps/

      - name: Build Linux + Windows plugin packages
        shell: bash
        run: |
          bash scripts/cuda-plugin-package.sh build-all \
            --out ./cuda-plugin-out \
            --version "$PLUGIN_VERSION" \
            --deps-dir ./cuda-deps
          echo "=== outputs ==="
          ls -la cuda-plugin-out/

      - name: Verify manifest JSON validity
        shell: bash
        run: |
          for manifest in cuda-plugin-out/*-manifest.json; do
            echo "Checking $manifest"
            python3 -c "import json; json.load(open('$manifest')); print('  valid JSON, files:', len(json.load(open('$manifest'))['files']))"
          done

      - name: Publish packages + manifests to tbc-tools-ci-cache Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_CACHE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=(
            cuda-plugin-out/tbc-tools-cuda-plugin-linux-x86_64.tar.gz
            cuda-plugin-out/tbc-cuda-plugin-linux-x86_64-manifest.json
            cuda-plugin-out/tbc-tools-cuda-plugin-windows-x86_64.zip
            cuda-plugin-out/tbc-cuda-plugin-windows-x86_64-manifest.json
          )
          # Create the release on the cache repo, or upload to an existing one.
          if gh release create "$PLUGIN_TAG" "${ASSETS[@]}" \
            --repo "$CACHE_REPOSITORY" \
            --title "CUDA plugin $PLUGIN_VERSION" \
            --notes "CUDA 11.8 + cuDNN 8.9 runtime plugin for nnTransform3D GPU acceleration.

          Packages:
          - tbc-tools-cuda-plugin-linux-x86_64.tar.gz
          - tbc-tools-cuda-plugin-windows-x86_64.zip

          Each package includes the ORT CUDA EP provider + the trimmed CUDA runtime
          (cudnn_adv_infer dropped as unused by the conv-only chroma_net_v2 model).
          SHA-256 verified against the manifest JSON at install time by the GUI plugin manager."; then
            echo "Created release $PLUGIN_TAG + uploaded assets."
          else
            echo "Release $PLUGIN_TAG already exists; uploading assets with --clobber."
            gh release upload "$PLUGIN_TAG" --repo "$CACHE_REPOSITORY" --clobber "${ASSETS[@]}"
          fi
          echo "Published $PLUGIN_TAG to $CACHE_REPOSITORY"

  build-and-publish-cuda-lite:
    name: Build + publish Teletext GPU (lite) plugin packages
    # Only run for workflow_dispatch or cuda-lite-plugin-v* tags.
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748); ubuntu-24.04 keeps today's behaviour.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/cuda-lite-plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve lite plugin version + tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.plugin_version }}"
          else
            # Tag push: cuda-lite-plugin-v1.0.0 -> version 1.0.0
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#cuda-lite-plugin-v}"
          fi
          echo "LITE_PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LITE_PLUGIN_TAG=cuda-lite-plugin-v$VERSION" >> "$GITHUB_ENV"
          echo "Resolved lite plugin version: $VERSION (tag: cuda-lite-plugin-v$VERSION)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lite plugin packages (Linux + Windows)
        shell: bash
        run: |
          bash scripts/cuda-plugin-package.sh build-cuda-lite-all \
            --out ./cuda-lite-out \
            --version "$LITE_PLUGIN_VERSION"
          echo "=== outputs ==="
          ls -la cuda-lite-out/

      - name: Verify manifest JSON validity
        shell: bash
        run: |
          for manifest in cuda-lite-out/*-manifest.json; do
            echo "Checking $manifest"
            python3 -c "import json; json.load(open('$manifest')); print('  valid JSON, files:', len(json.load(open('$manifest'))['files']))"
          done

      - name: Publish lite packages + manifests to tbc-tools-ci-cache Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_CACHE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=(
            cuda-lite-out/tbc-tools-cuda-lite-plugin-linux-x86_64.tar.gz
            cuda-lite-out/tbc-cuda-lite-plugin-linux-x86_64-manifest.json
            cuda-lite-out/tbc-tools-cuda-lite-plugin-windows-x86_64.zip
            cuda-lite-out/tbc-cuda-lite-plugin-windows-x86_64-manifest.json
          )
          # Create the release on the cache repo, or upload to an existing one.
          if gh release create "$LITE_PLUGIN_TAG" "${ASSETS[@]}" \
            --repo "$CACHE_REPOSITORY" \
            --title "Teletext GPU (lite) plugin $LITE_PLUGIN_VERSION" \
            --notes "pyopencl runtime plugin (bundled OpenCL ICD loader) for GPU-accelerated
          teletext deconvolution in tbc-process-vbi via the OpenCL backend of the
          user's GPU driver (NVIDIA/AMD/Intel). Wheels-only package; the driver
          provides the OpenCL ICD. Linux: pyopencl wheels for system Pythons
          cp310-cp313 (numpy from the system). Windows: Python embeddable
          distribution + the pyopencl wheel closure.

          Packages:
          - tbc-tools-cuda-lite-plugin-linux-x86_64.tar.gz
          - tbc-tools-cuda-lite-plugin-windows-x86_64.zip

          SHA-256 verified against plugins/catalog.json files[] at install time
          by the GUI plugin manager (generic backend)."; then
            echo "Created release $LITE_PLUGIN_TAG + uploaded assets."
          else
            echo "Release $LITE_PLUGIN_TAG already exists; uploading assets with --clobber."
            gh release upload "$LITE_PLUGIN_TAG" --repo "$CACHE_REPOSITORY" --clobber "${ASSETS[@]}"
          fi
          echo "Published $LITE_PLUGIN_TAG to $CACHE_REPOSITORY"
